<!doctype html>
<!-- Source for the 1200x630 Open Graph images in /assets/og/.
     Render one image per section with .claude/og/render.sh (headless Chrome).
     The variant comes from the URL hash: #home, #guides, #tools, #compare, #default. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Inter";
        font-weight: 300 700;
        src: url("../../assets/fonts/inter-latin-var.woff2") format("woff2");
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #faf7f2;
        color: #2b2b2b;
        font-family: "Inter", sans-serif;
        position: relative;
      }
      .card {
        position: absolute;
        inset: 32px;
        border-radius: 32px;
        background: #eee7df;
        border: 2px solid #d6cec5;
        overflow: hidden;
      }
      .text {
        position: absolute;
        left: 72px;
        top: 64px;
        width: 680px;
        bottom: 64px;
        display: flex;
        flex-direction: column;
      }
      .brand { display: flex; align-items: center; gap: 16px; font-weight: 600; font-size: 34px; letter-spacing: -0.02em; }
      .brand img { width: 64px; height: 64px; border-radius: 22%; }
      .label {
        margin-top: 44px;
        align-self: flex-start;
        background: #e59f42;
        color: #2b2b2b;
        font-weight: 600;
        font-size: 24px;
        padding: 8px 20px;
        border-radius: 999px;
      }
      h1 { margin-top: 24px; font-size: 64px; line-height: 1.08; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; }
      .label:not([hidden]) + h1 { font-size: 56px; }
      .foot { margin-top: auto; font-size: 26px; color: #4b4b4b; }
      .mascot { position: absolute; right: 40px; bottom: -6px; height: 540px; width: auto; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="text">
        <div class="brand"><img src="../../assets/images/icon-180.png" alt="" />Buzz Off</div>
        <div class="label" id="label" hidden></div>
        <h1 id="headline"></h1>
        <p class="foot" id="foot">Free on the App Store · iPhone</p>
      </div>
      <img class="mascot" src="../../assets/images/mascot/capybara-waving-720.webp" alt="" />
    </div>
    <script>
      var variants = {
        home: { headline: "Quit or cut back on caffeine, at your own pace." },
        default: { headline: "Quit or cut back on caffeine, at your own pace." },
        guides: { label: "Guides", headline: "Clear, sourced answers to your caffeine questions." },
        tools: { label: "Free tools", headline: "Caffeine calculators that run in your browser." },
        compare: { label: "Compare", headline: "Apps to quit caffeine, compared on the facts." },
      };
      var v = variants[location.hash.slice(1)] || variants.default;
      document.getElementById("headline").textContent = v.headline;
      if (v.label) {
        var l = document.getElementById("label");
        l.textContent = v.label;
        l.hidden = false;
      }
    </script>
  </body>
</html>
